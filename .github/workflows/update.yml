name: Auto Update

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:      # Manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./update.sh

      - name: Check for changes
        id: check
        run: |
          PREVIOUS=$(git show HEAD:package-x86_64.nix | grep 'version = ' | head -1 | sed 's/.*"\(.*\)".*/\1/')
          VERSION=$(grep 'version = ' package-x86_64.nix | head -1 | sed 's/.*"\(.*\)".*/\1/')

          echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if git diff --quiet; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
            git diff
          fi

      - name: Test build
        if: steps.check.outputs.updated == 'true'
        run: |
          nix build .#helium --accept-flake-config

      - name: Commit and push
        if: steps.check.outputs.updated == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-x86_64.nix package-aarch64.nix
          git commit -m "Update helium to ${VERSION}"
          git push

      - name: Create Release
        if: steps.check.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
          PREVIOUS: ${{ steps.check.outputs.previous }}
        run: |
          gh release create "v${VERSION}" \
            --title "helium ${VERSION}" \
            --notes "Updated helium from ${PREVIOUS} to ${VERSION}"
